# Values do chart ingress-nginx/ingress-nginx.
# Os Ingress de cada serviço ficam nos repos dos serviços; aqui só entregamos
# o controller e a IngressClass "nginx".
controller:
  # Um único NLB interno, alvo do VPC Link do API Gateway.
  service:
    type: LoadBalancer
    annotations:
      # O cluster não tem AWS Load Balancer Controller: quem cria o NLB é o
      # cloud provider embutido, que só reconhece estas duas annotations.
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"

  ingressClass: nginx
  ingressClassResource:
    name: nginx
    controllerValue: k8s.io/ingress-nginx

  # Nós t3.small têm pouca capacidade: 1 réplica basta para este ambiente.
  replicaCount: 1
