# Namespace do ambiente. É infraestrutura do cluster (ADR 0002), por isso
# vive aqui — o que roda DENTRO dele (Deployment/Service/HPA/Secret da app)
# é do repo da aplicação, aplicado pelo pipeline dela (ADR 0001).
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    ambiente: prod
    app.kubernetes.io/part-of: oficina
